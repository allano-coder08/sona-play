<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allan Music Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>🎵 Allan Music</h2>

            <nav>
                <a href="#" class="active">🏠 Home</a>
                <a href="#">🔍 Search</a>
                <a href="#">📚 Your Library</a>
            </nav>

            <div class="playlists">
                <h3>Your Playlists</h3>
                <p>+ Create Playlist</p>
                <p>❤️ Liked Songs</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <header>
                <h1>Good Music, Good Mood 🎧</h1>
                <button id="loginBtn">Connect Spotify</button>
            </header>

            <section class="search-section">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search songs, artists..."
                >
                <button id="searchBtn">Search</button>
            </section>

            <section class="music-section">
                <h2>Search Results</h2>
                <div id="results">
                    <p>Search for your favourite music.</p>
                </div>
            </section>

        </main>

        <!-- Music Player -->
        <footer class="player">
            <div class="song-info">
                <div class="album-art">🎵</div>
                <div>
                    <h4 id="songTitle">No song selected</h4>
                    <p id="artistName">Allan Music Bot</p>
                </div>
            </div>

            <div class="player-controls">
                <button id="previousBtn">⏮</button>
                <button id="playBtn">▶</button>
                <button id="nextBtn">⏭</button>
            </div>

            <div class="volume">
                <span>🔊</span>
                <input type="range" min="0" max="100" value="50">
            </div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
